# Build the production image on every published GitHub Release and push
# it to Docker Hub AND GitHub Container Registry (ghcr.io), tagged with
# the release name (plus `latest` for stable releases). Pushing to GHCR
# in parallel to Docker Hub means the image shows up under the repo's
# Packages tab and avoids Docker Hub's anonymous-pull rate limits for
# free-tier users.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   - vars.DOCKERHUB_USERNAME — your Docker Hub account name
#   - vars.DOCKERHUB_IMAGE    — image name (defaults to `otlpdashboard` if unset)
#   - secrets.DOCKERHUB_TOKEN — Docker Hub Access Token (Account Settings →
#                               Security → New Access Token; scope: Read/Write)
#
# GHCR uses the built-in GITHUB_TOKEN, no extra secrets needed. The image
# lands at `ghcr.io/<owner>/<repo-name-lowercased>` (the repo name is
# resolved at runtime so a fork doesn't need to edit this file).
#
# The release tag becomes the image tag verbatim (e.g. `v1.2.3`) plus a
# stripped semver variant (`1.2.3`). Stable releases also re-tag `latest`;
# prereleases (rc/beta/alpha) don't, so `latest` always points to the
# newest stable build.

name: Release — build and push Docker image

on:
  release:
    types: [published]
  # Manual trigger so you can re-build a previously published release
  # without cutting a new one (e.g. after a base-image CVE).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.2.3)'
        required: true

permissions:
  contents: read
  # Required for ghcr.io push via GITHUB_TOKEN.
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      version: ${{ steps.ref.outputs.version }}
    steps:
      - name: Resolve release ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="${{ inputs.tag }}"
          else
            ref="${{ github.event.release.tag_name }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          # `proto/opentelemetry-proto` is a submodule; the Ingestion
          # project's gRPC codegen needs the .proto files at build time.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Both registries get the same set of tags. GHCR's image path
          # is forced lowercase because the registry rejects mixed-case
          # repo names (a repo called `OtlpDashboard` becomes
          # `ghcr.io/adiakys/otlpdashboard`).
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE || 'otlpdashboard' }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          # `flavor: latest=false` keeps `latest` off by default; the
          # `type=raw,value=latest` rule below re-adds it only on stable
          # releases (no prerelease suffix).
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.ref.outputs.ref }}
            type=match,pattern=v(\d+\.\d+\.\d+),group=1,value=${{ steps.ref.outputs.ref }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/OpenTelemetryDashboard.Host/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.ref.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish server.json to the official MCP Registry, pointing at the image
  # just pushed to GHCR. Only on a real release: a manual rebuild would try
  # to republish a version the registry already has.
  publish-mcp-registry:
    needs: build-and-push
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-and-push.outputs.ref }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Set version and image in server.json
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ needs.build-and-push.outputs.ref }}
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          jq --arg v "$VERSION" --arg i "$image" '.version = $v | .packages[0].identifier = $i' server.json > server.tmp
          mv server.tmp server.json

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
