# Publish the static landing page (`site/`) to the GitHub Pages root and
# the SPA, built in demo mode, under `/demo/`.
#
# The demo build sets VITE_DEMO_MODE=true (the SPA's plugin swaps in a
# DemoFetcher that serves mock telemetry from `web/app/demo/`) and
# NUXT_APP_BASE_URL=/<repo>/demo/ so URLs resolve under that subpath.
#
# Pages must be enabled in repo settings → Pages → Source: GitHub Actions.

name: Deploy demo to GitHub Pages

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          # `demo/packs/default/` is a submodule (the widget-library pack
          # lives in its own repo). Without this the demo bundle would
          # ship empty libraries and the SPA would render the dashboard
          # with placeholder widgets only.
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static demo bundle
        env:
          VITE_DEMO_MODE: 'true'
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/demo/
        run: pnpm generate:demo

      - name: Assemble site
        working-directory: .
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r web/.output/public _site/demo

      # GitHub Pages only serves the root 404.html. Making it the SPA's
      # index.html lets demo deep links survive a hard refresh; paths
      # outside /demo/ (links to the demo from before it moved) are
      # redirected into it.
      - name: Add SPA 404 fallback
        working-directory: .
        env:
          BASE: /${{ github.event.repository.name }}/
        run: |
          redirect="<script>(function(){var b='${BASE}',p=location.pathname;if(p.indexOf(b)!==0||p.indexOf(b+'demo/')===0)return;location.replace(b+'demo/'+p.slice(b.length)+location.search+location.hash)})()</script>"
          sed "s#<head>#<head>${redirect}#" _site/demo/index.html > _site/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
