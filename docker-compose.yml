# Demo stack: dashboard + Postgres + Redis + sample-server / sample-client +
# OpenTelemetry Collector. The dashboard persists telemetry to the Postgres
# container by default (no external DB needed).
#
#   docker compose up --build
#
# To switch to SQL Server, start with `--profile sqlserver` and override
# Dashboard__Storage__Provider on the dashboard service (the SqlServer
# connection string is already wired below for that case).
#
# Listens on:
#   - localhost:4317 — OTLP gRPC ingestion
#   - localhost:4318 — OTLP HTTP ingestion + SPA + /api + /mcp + /healthz

services:
  dashboard:
    image: opentelemetrydashboard:dev
    container_name: otel-dashboard
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 2.0
    build:
      context: .
      dockerfile: src/OpenTelemetryDashboard.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DASHBOARD__BROWSERTOKEN: "changeme"
      DASHBOARD__OTLP__APIKEY: "api_token"
      DASHBOARD__MCP__ENABLED: "true"
      Dashboard__Ingestion__Channel__Capacity: "20000"
      Logging__LogLevel__OpenTelemetryDashboard: "Debug"
      Dashboard__DemoSeed__Enabled: "true"
      Dashboard__Storage__Provider: "PostgreSql"
      ConnectionStrings__PostgreSql: "Host=postgres;Database=telemetry;Username=otel;Password=otel"
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=telemetry;User Id=sa;Password=Otel-Strong!2026;TrustServerCertificate=True"
      # Retention windows (days). Sized comfortably above the 7d demo seed
      # so the seeded data isn't wiped by the first retention sweep, and
      # large enough that the SPA's "last 7d" picker shows a meaningful
      # info hint about auto-deletion in the demo stack.
      Dashboard__TelemetryLimits__MaxLogDays: "30"
      Dashboard__TelemetryLimits__MaxTraceDays: "30"
      Dashboard__TelemetryLimits__MaxMetricDays: "30"
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP/Protobuf + /healthz
    volumes:
      - dashboard-data:/app/data
      - ./demo/widget-libraries/dotnet:/app/data/widget-libraries/dotnet:ro
      - ./demo/widget-libraries/postgres:/app/data/widget-libraries/postgres:ro
      - ./demo/dashboards:/app/builtin-dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Two replicas of the sample server, both reporting under the same
  # service.name=sample-server but with distinct service.instance.id
  # values (server-1, server-2). This is the canonical
  # multi-instance shape the dashboard's metrics tree and trace
  # service-cell ("(+N)" tooltip) are designed to surface.
  sample-server-1:
    build:
      context: .
      dockerfile: demo/Server/Dockerfile
    image: oteldemo-sample-server:dev
    container_name: oteldemo-sample-server-1
    restart: unless-stopped
    ports:
      - "5050:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=sampleapp;Username=otel;Password=otel"
      ConnectionStrings__Redis: "redis:6379"
      Otel__Endpoint: "http://dashboard:4317"
      Otel__Headers: "Authorization=Bearer api_token"
      Otel__ServiceInstanceId: "server-1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      dashboard:
        condition: service_started

  sample-server-2:
    build:
      context: .
      dockerfile: demo/Server/Dockerfile
    image: oteldemo-sample-server:dev
    container_name: oteldemo-sample-server-2
    restart: unless-stopped
    ports:
      - "5051:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=sampleapp;Username=otel;Password=otel"
      ConnectionStrings__Redis: "redis:6379"
      Otel__Endpoint: "http://dashboard:4317"
      Otel__Headers: "Authorization=Bearer api_token"
      Otel__ServiceInstanceId: "server-2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      dashboard:
        condition: service_started

  sample-client:
    build:
      context: .
      dockerfile: demo/Client/Dockerfile
    image: oteldemo-sample-client:dev
    container_name: oteldemo-sample-client
    restart: unless-stopped
    environment:
      # CSV: the client round-robins each iteration across these
      # endpoints, so traces split evenly between the two server
      # instances.
      Server__BaseUrls: "http://sample-server-1:8080,http://sample-server-2:8080"
      Loop__IntervalMs: "3000"
      Otel__Endpoint: "http://dashboard:4317"
      Otel__Headers: "Authorization=Bearer api_token"
    depends_on:
      sample-server-1:
        condition: service_started
      sample-server-2:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: otel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: otel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otel -d telemetry"]
      interval: 3s
      timeout: 1s
      retries: 15

  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: otel-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Otel-Strong!2026}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: otel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./demo/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - dashboard
      - redis
      - postgres

volumes:
  dashboard-data:
  postgres-data:
  sqlserver-data:
  redis-data:
