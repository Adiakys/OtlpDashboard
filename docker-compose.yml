x-telemetrygen: &telemetrygen
  image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
  restart: unless-stopped
  depends_on:
    opentelemetrydashboard.host:
      condition: service_started

services:
  opentelemetrydashboard.host:
    image: opentelemetrydashboard.host
    build:
      context: .
      dockerfile: src/OpenTelemetryDashboard.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DASHBOARD__BROWSERTOKEN: "changeme"
      DASHBOARD__OTLP__APIKEY: "api_token"
      DASHBOARD__MCP__ENABLED: "true"
      Dashboard__Ingestion__Channel__Capacity: "20000"
      Logging__LogLevel__OpenTelemetryDashboard: "Debug"
      Dashboard__DemoSeed__Enabled: "true"
      Dashboard__Storage__Provider: "PostgreSql"
      ConnectionStrings__PostgreSql: "Host=postgres;Database=telemetry;Username=otel;Password=otel"
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=telemetry;User Id=sa;Password=Otel-Strong!2026;TrustServerCertificate=True"
      # Retention windows (days). Sized comfortably above the 7d demo seed
      # so the seeded data isn't wiped by the first retention sweep, and
      # large enough that the SPA's "last 7d" picker shows a meaningful
      # info hint about auto-deletion in the demo stack.
      Dashboard__TelemetryLimits__MaxLogDays: "30"
      Dashboard__TelemetryLimits__MaxTraceDays: "30"
      Dashboard__TelemetryLimits__MaxMetricDays: "30"
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP/Protobuf + /healthz
    volumes:
      - dashboard-data:/app/data
      - ./demo/packs/default:/app/builtin-packs/default:ro
      - ./demo/packs/default-dashboard:/app/builtin-packs/default-dashboard:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Two replicas of the sample server, both reporting under the same
  # service.name=sample-server but with distinct service.instance.id values
  # (server-1, server-2). This is the canonical multi-instance shape the
  # dashboard's metrics tree and trace service-cell ("(+N)" tooltip) are
  # designed to surface.
  server:
    image: server
    build:
      context: .
      dockerfile: demo/Server/Dockerfile
    restart: unless-stopped
    ports:
      - "5050:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=sampleapp;Username=otel;Password=otel"
      ConnectionStrings__Redis: "redis:6379"
      Otel__Endpoint: "http://opentelemetrydashboard.host:4317"
      Otel__Headers: "Authorization=Bearer api_token"
      Otel__ServiceInstanceId: "server-1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      opentelemetrydashboard.host:
        condition: service_started
    # `server` and `server-2` share the same Postgres DB and both seed the
    # `sample_counters` row at startup. Healthy = past `app.Run()`, so past
    # the seed — `server-2` waits for this below to avoid a PK race on
    # first boot.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 5s

  server-2:
    image: server
    build:
      context: .
      dockerfile: demo/Server/Dockerfile
    restart: unless-stopped
    ports:
      - "5051:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=sampleapp;Username=otel;Password=otel"
      ConnectionStrings__Redis: "redis:6379"
      Otel__Endpoint: "http://opentelemetrydashboard.host:4317"
      Otel__Headers: "Authorization=Bearer api_token"
      Otel__ServiceInstanceId: "server-2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      opentelemetrydashboard.host:
        condition: service_started
      server:
        condition: service_healthy

  client:
    image: client
    build:
      context: .
      dockerfile: demo/Client/Dockerfile
    restart: unless-stopped
    environment:
      # CSV: the client round-robins each iteration across these endpoints,
      # so traces split evenly between the two server instances.
      Server__BaseUrls: "http://server:8080,http://server-2:8080"
      Loop__IntervalMs: "3000"
      Otel__Endpoint: "http://opentelemetrydashboard.host:4317"
      Otel__Headers: "Authorization=Bearer api_token"
    depends_on:
      server:
        condition: service_started
      server-2:
        condition: service_started

  gen-api-gateway:
    <<: *telemetrygen
    command:
      - traces
      - --otlp-endpoint=opentelemetrydashboard.host:4317
      - --otlp-insecure
      - --otlp-header=Authorization="Bearer api_token"
      - --service=api-gateway
      - --child-spans=4
      - --rate=1
      - --duration=inf

  gen-checkout:
    <<: *telemetrygen
    command:
      - traces
      - --otlp-endpoint=opentelemetrydashboard.host:4317
      - --otlp-insecure
      - --otlp-header=Authorization="Bearer api_token"
      - --service=checkout
      - --child-spans=4
      - --rate=1
      - --duration=inf

  gen-payments:
    <<: *telemetrygen
    command:
      - traces
      - --otlp-endpoint=opentelemetrydashboard.host:4317
      - --otlp-insecure
      - --otlp-header=Authorization="Bearer api_token"
      - --service=payments
      - --child-spans=4
      - --rate=1
      - --duration=inf

  gen-audit-logs:
    <<: *telemetrygen
    command:
      - logs
      - --otlp-endpoint=opentelemetrydashboard.host:4317
      - --otlp-insecure
      - --otlp-header=Authorization="Bearer api_token"
      - --service=audit
      - --body=synthetic audit event
      - --rate=1
      - --duration=inf

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: otel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otel -d telemetry"]
      interval: 3s
      timeout: 1s
      retries: 15

  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Otel-Strong!2026}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./demo/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - opentelemetrydashboard.host
      - redis
      - postgres

volumes:
  dashboard-data:
  postgres-data:
  sqlserver-data:
  redis-data: