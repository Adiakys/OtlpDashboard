# Docker Compose di sviluppo.
#
# Default (SQLite — niente DB esterno):
#   docker compose up --build
#
# PostgreSQL (i default puntano gia' al container `postgres` su rete Compose):
#   STORAGE_PROVIDER=PostgreSql docker compose --profile postgres up --build
#
# SQL Server (i default puntano gia' al container `sqlserver`):
#   STORAGE_PROVIDER=SqlServer docker compose --profile sqlserver up --build
#
# Per puntare a un DB esterno (non al container interno) sovrascrivere
# CONN_POSTGRESQL / CONN_SQLSERVER in .env. Vedi .env.example.
#
# Ascolto:
#   - gRPC OTLP : localhost:4317
#   - HTTP OTLP : localhost:4318 (anche /healthz)

services:
  dashboard:
    build:
      context: .
      dockerfile: src/OpenTelemetryDashboard.Host/Dockerfile
    image: opentelemetrydashboard:dev
    container_name: otel-dashboard
    restart: unless-stopped
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP/Protobuf + /healthz
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DASHBOARD__BROWSERTOKEN: changeme
      OpenTelemetryDashboard__Ingestion__Channel__Capacity: "20000"
      Logging__LogLevel__OpenTelemetryDashboard: "Debug"
      Dashboard__Storage__Provider: ${STORAGE_PROVIDER:-Sqlite}
      ConnectionStrings__Sqlite: "${CONN_SQLITE:-Data Source=/app/data/telemetry.db}"
      ConnectionStrings__SqlServer: "${CONN_SQLSERVER:-Server=sqlserver;Database=telemetry;User Id=sa;Password=Otel-Strong!2026;TrustServerCertificate=True}"
      ConnectionStrings__PostgreSql: "${CONN_POSTGRESQL:-Host=postgres;Database=telemetry;Username=otel;Password=otel}"
    volumes:
      - dashboard-data:/app/data
      # Demo widget library — mounted read-only inside the volume so it
      # ships out-of-the-box with `docker compose up --build`. Drop your
      # own libraries via `docker cp ... otel-dashboard:/app/data/widget-libraries/<id>/`
      # or remove this line if you don't want the sample showing up.
      - ./widget-libraries-demo/demo-pack:/app/data/widget-libraries/demo-pack:ro
    # Soft caps tuned for the typical self-hosted deployment. Combined with
    # DOTNET_GCConserveMemory=9 / GCRetainVM=0 in the image, the runtime
    # actively returns pages to the OS instead of holding them as headroom.
    # Override (or remove) for high-throughput ingestion.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 2.0
    # The image declares its own HEALTHCHECK using busybox `wget`; Compose
    # picks it up automatically. No `curl` install required.

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: otel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: otel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otel -d telemetry"]
      interval: 10s
      timeout: 3s
      retries: 5

  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: otel-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Otel-Strong!2026}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  telemetrygen-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    profiles: ["otel-test"]
    depends_on:
      - dashboard
    command: >
      traces
      --otlp-endpoint dashboard:4317
      --otlp-insecure
      --rate 5
      --duration 300s

  telemetrygen-logs:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    profiles: ["otel-test"]
    depends_on:
      - dashboard
    command: >
      logs
      --otlp-endpoint dashboard:4317
      --otlp-insecure
      --rate 5
      --duration 300s

  telemetrygen-metrics:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    profiles: ["otel-test"]
    depends_on:
      - dashboard
    # Il translator lato dashboard supporta Gauge e Sum; telemetrygen per
    # default emette un Sum ("gen") — perfetto per popolare /metrics senza
    # configurazione extra.
    command: >
      metrics
      --otlp-endpoint dashboard:4317
      --otlp-insecure
      --rate 5
      --duration 300s

volumes:
  dashboard-data:
  postgres-data:
  sqlserver-data:
